name: MCP cross-client interoperability (Python and TypeScript)
on:
  push:
    branches: [feat/claude-public-readonly-20261029]
  pull_request:
    branches: [feat/claude-public-readonly-20261029]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Public production URLs; no real work data is accessed.
      EAP_PUBLIC_MCP_URL: https://arquimedes-mcp-eap.vercel.app/public-mcp
      CRONOGRAMA_PUBLIC_MCP_URL: https://arquimedes-mcp-cronograma.vercel.app/public-mcp
      # Public Gantt/LOB production endpoint.
      GANTT_LOB_PUBLIC_MCP_URL: https://arquimedes-mcp-gantt-lob.vercel.app/public-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official Python MCP client
        run: python -m pip install 'mcp==2.3.0'
      - name: Exercise legacy and modern with official Python MCP client
        run: python scripts/clients/python_client_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install official TypeScript MCP v2 client
        working-directory: scripts/clients
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Exercise legacy and modern with official TypeScript MCP client
        run: node scripts/clients/typescript_client_smoke.mjs

  browser-cors:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLIC_ALLOWED_ORIGINS: https://independent-client.example
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify public browser MCP CORS and private endpoint isolation
        run: python -m pytest tests/test_public_mcp_cors.py -q

  production-security:
    name: Stateless public calculation and private 401 (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eap
            url: https://arquimedes-mcp-eap.vercel.app
          - service: cronograma
            url: https://arquimedes-mcp-cronograma.vercel.app
          - service: gantt_lob
            url: https://arquimedes-mcp-gantt-lob.vercel.app
    env:
      MCP_TARGET: ${{ matrix.service }}
      MCP_BASE_URL: ${{ matrix.url }}
      MCP_REQUIRE_MODERN: "1"
      MCP_REPORT_PATH: artifacts/production-${{ matrix.service }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm live production legacy/modern MCP and private access denial
        run: python scripts/check_public_mcp.py
      - name: Archive production audit record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-mcp-${{ matrix.service }}
          path: artifacts/production-${{ matrix.service }}.json
          if-no-files-found: warn
