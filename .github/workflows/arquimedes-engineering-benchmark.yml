name: Arquimedes Engineering Benchmark — gantt_lob
on:
  push:
    branches: [audit/engineering-benchmark-p2-20261030, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engineering-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MCP_TARGET: gantt_lob
      MCP_PUBLIC_ALLOWED_ORIGINS: https://independent-client.example
      VERCEL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen domain and test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install 'pytest-timeout==2.3.1' httpx
          python -m pip check
      - name: Validate syntax
        run: python -m compileall -q .
      - name: All Gantt, LOB, XLSX and independent benchmark tests
        run: python -m pytest tests/ -q --maxfail=1 --timeout=90 --timeout-method=thread --cov=mcp_gantt_lob --cov-report=term-missing --cov-fail-under=70 --junitxml=artifacts/engineering.xml
      - name: Summarize engineering results without inventing missing cases
        if: always()
        run: |
          python scripts/benchmark_report.py artifacts/engineering.xml artifacts/engineering-report.json
          if [ -f artifacts/protocol.xml ]; then python scripts/benchmark_report.py artifacts/protocol.xml artifacts/transport-report.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arquimedes-engineering-benchmark-gantt_lob
          path: artifacts/
          if-no-files-found: warn
