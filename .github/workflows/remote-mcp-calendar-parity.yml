name: Remote MCP calendar parity QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/qa_remote_calendar_parity.py"
      - "scripts/qa_remote_three_mcp_chain.py"
      - "scripts/qa_remote_front_team_calendars.py"
      - "scripts/qa_remote_building_30_activities.py"
      - "scripts/qa_remote_resource_front_stress.py"
      - "scripts/qa_remote_resource_front_stress_100.py"
      - "scripts/qa_remote_resource_front_stress_200.py"
      - ".github/workflows/remote-mcp-calendar-parity.yml"

permissions:
  contents: read

jobs:
  remote-mcp-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP test client
        run: python -m pip install fastmcp==4.0.3 httpx==0.28.1
      - name: Verify public tools and CPM/LOB calendar consistency
        run: python scripts/qa_remote_calendar_parity.py
      - name: Verify remote EAP to CPM LOB cost workflow
        run: python scripts/qa_remote_three_mcp_chain.py
      - name: Verify remote physical fronts team calendars and cost extensions
        run: python scripts/qa_remote_front_team_calendars.py
      - name: Validate Edificio QA-001 30 activities EAP CPM LOB parity
        run: python scripts/qa_remote_building_30_activities.py
      - name: Audit 32 tasks with resource and physical front conflicts
        run: python scripts/qa_remote_resource_front_stress.py
      - name: Audit 100 activities on 25 floors with shared resources
        run: python scripts/qa_remote_resource_front_stress_100.py
      - name: Audit 200 activity declared limit with resource and front conflicts
        run: python scripts/qa_remote_resource_front_stress_200.py
