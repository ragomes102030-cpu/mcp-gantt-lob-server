name: Remote MCP calendar parity QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/qa_remote_calendar_parity.py"
      - ".github/workflows/remote-mcp-calendar-parity.yml"

permissions:
  contents: read

jobs:
  remote-mcp-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP test client
        run: python -m pip install fastmcp==4.0.3 httpx==0.28.1
      - name: Verify public tools and CPM/LOB calendar consistency
        run: python scripts/qa_remote_calendar_parity.py
