name: Engineering quality P1 — Gantt and LOB
on:
  push:
    branches: [feat/quality-engineering-p1-20261030]
  pull_request:
    branches: [feat/claude-public-readonly-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engineering-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MCP_PUBLIC_ALLOWED_ORIGINS: https://independent-client.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests and tools
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: Validate Gantt/LOB calculations, public input and line-of-balance step data
        run: python -m pytest tests/ -q --cov=mcp_gantt_lob --cov-report=term-missing --cov-fail-under=70 --maxfail=1
